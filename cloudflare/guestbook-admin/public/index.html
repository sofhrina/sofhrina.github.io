<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Guestbook Backstage · Sofhrina</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header><p>SOFHRINA.COM · PRIVATE</p><h1>Guestbook Backstage</h1><span>Read the room, then open the curtain.</span></header>
  <main>
    <nav aria-label="Filter messages">
      <button class="active" data-status="pending">Waiting</button>
      <button data-status="approved">On the wall</button>
      <button data-status="rejected">Archived</button>
      <button data-status="all">All</button>
    </nav>
    <p id="status" role="status">Loading notes…</p>
    <section id="messages" aria-live="polite"></section>
  </main>
  <template id="message-template">
    <article class="note">
      <div class="note-head"><div><h2></h2><a class="email"></a></div><time></time></div>
      <blockquote></blockquote>
      <div class="actions">
        <button data-action="approved">Approve</button>
        <button data-action="rejected">Archive</button>
        <button data-action="delete" class="delete">Delete forever</button>
      </div>
    </article>
  </template>
  <script src="admin.js" defer></script>
</body>
</html>
